# Local Db2 for the live integration test (tests/db2_roundtrip.rs).
#
#   docker compose -f docker/docker-compose.yml up -d     # wait until healthy
#   export HALCYON_TEST_DSN='DATABASE=SAMPLE;HOSTNAME=localhost;PORT=50000;\
#     PROTOCOL=TCPIP;UID=db2inst1;PWD=halcyon;'
#   cargo test --test db2_roundtrip -- --nocapture
#
# Mirrors the C++ Halcyon compose setup so both ports validate against the same
# image. First boot takes a few minutes while Db2 creates the SAMPLE database.
services:
  db2:
    image: icr.io/db2_community/db2:11.5.9.0
    privileged: true
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: halcyon
      DBNAME: SAMPLE
      PERSISTENT_HOME: "false"
      # Without this the image enables archive logging AFTER creating SAMPLE,
      # briefly putting it in BACKUP PENDING (SQL1116N) — a window the
      # healthcheck can pass just before, flaking the round-trip. Plain
      # circular logging is fine for a throwaway test database, and boots
      # faster too.
      ARCHIVE_LOGS: "false"
    ports:
      - "50000:50000"
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to SAMPLE' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
