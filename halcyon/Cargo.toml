[package]
name = "halcyon"
description = "A high-level, ergonomic IBM Db2 client for Rust, built on the Db2 CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["db2", "database", "sql", "ibm", "cli"]
categories = ["database", "api-bindings", "external-ffi-bindings"]

# `cfg(loom)` is not a Cargo feature — it's set by the dedicated loom CI job /
# manual `--cfg loom` runs (see sync.rs). Registering it here keeps rustc's
# `unexpected_cfgs` lint quiet under normal `-D warnings` builds.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[features]
default = ["db2", "derive"]
# Links the IBM Db2 CLI driver (clidriver) and enables the real Db2CliDriver.
# Disable to build/test the pure-Rust layers without clidriver installed.
db2 = ["dep:halcyon-sys"]
# Enables `#[derive(FromRow)]`. Pure-Rust (no clidriver); on by default.
derive = ["dep:halcyon-derive"]
# Exposes the concurrency stress harness (ConcurrentFakeDriver, runner,
# scenarios) as `halcyon::stress`. Pure-Rust, test/bench only; off by default.
stress = []

[dependencies]
halcyon-sys = { path = "../halcyon-sys", optional = true }
halcyon-derive = { path = "../halcyon-derive", optional = true }

[dev-dependencies]
# UI/compile-fail tests for #[derive(FromRow)] (tests/derive_ui.rs); only run
# when the `derive` feature is enabled.
trybuild = "1"

# Micro-benchmarks (benches/pool_bench.rs); default-features off keeps plotters/
# rayon and their heavier deps out (and off the MSRV path), but `cargo_bench_support`
# stays on so `harness = false` benches still parse `cargo bench` args. The bench
# target is gated on `stress` via required-features, so a normal `cargo test`/MSRV
# build never compiles it.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# docs.rs has no clidriver and cannot link libdb2, so build the published docs
# without the `db2` feature. `derive` is pure-Rust and part of the documented
# surface, so keep it on. Mirrors the CI `--no-default-features` doc/test path.
[package.metadata.docs.rs]
no-default-features = true
features = ["derive"]

# loom is pulled in ONLY under `--cfg loom` (the dedicated CI job / manual runs).
# Normal builds, MSRV, and docs.rs never see it. It backs the cfg-gated `sync`
# shim so the pool's Mutex/Condvar/thread logic can be model-checked.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[[bench]]
name = "pool_bench"
harness = false
required-features = ["stress"]
