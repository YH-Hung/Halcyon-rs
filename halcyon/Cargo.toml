[package]
name = "halcyon"
description = "A high-level, ergonomic IBM Db2 client for Rust, built on the Db2 CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
documentation = "https://docs.rs/halcyon"
keywords = ["db2", "database", "sql", "ibm", "cli"]
categories = ["database", "api-bindings", "external-ffi-bindings"]

# `cfg(loom)` is not a Cargo feature — it's set by the dedicated loom CI job /
# manual `--cfg loom` runs (see sync.rs). Registering it here keeps rustc's
# `unexpected_cfgs` lint quiet under normal `-D warnings` builds.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[features]
default = ["db2", "derive"]
# Links the IBM Db2 CLI driver (clidriver) and enables the real Db2CliDriver.
# Disable to build/test the pure-Rust layers without clidriver installed.
db2 = ["dep:halcyon-sys"]
# Enables `#[derive(FromRow)]`. Pure-Rust (no clidriver); on by default.
derive = ["dep:halcyon-derive"]
# Feature-gated async facade: `AsyncDatabase` over tokio's spawn_blocking. Off
# by default so the pure-Rust and MSRV lanes never compile tokio (mirrors how
# the criterion/loom deps are kept off those paths). The optional tokio dep
# below bundles the test-runtime features (rt-multi-thread, macros) alongside
# `rt`, so the `#[tokio::test]` suite runs from lib unit tests with no
# dev-dependency — keeping tokio out of every build that omits this feature.
tokio = ["dep:tokio"]
# Feature-gated observability: process-global `tracing` spans + `metrics`
# counters/histograms/gauges (C++ Halcyon catalog). Off by default so pure-Rust
# and MSRV lanes never compile these deps. Downstream installs a subscriber /
# recorder (and exporters); Halcyon does not ship Prometheus/OTel adapters.
observability = ["dep:tracing", "dep:tracing-core", "dep:metrics"]
# Exposes the concurrency stress harness (ConcurrentFakeDriver, runner,
# scenarios) as `halcyon::stress`. Pure-Rust, test/bench only; off by default.
stress = []

[dependencies]
halcyon-sys = { path = "../halcyon-sys", version = "0.1.0", optional = true }
halcyon-derive = { path = "../halcyon-derive", version = "0.1.0", optional = true }
# Async facade runtime (feature `tokio`). The library itself needs only `rt`
# (for spawn_blocking); `rt-multi-thread` + `macros` are here so the gated
# `#[tokio::test]` async unit tests build without a separate dev-dependency
# (which would otherwise compile tokio on the pure-Rust/MSRV test lanes).
# Tokio 1.54 raises MSRV to 1.85. Keep fresh downstream resolutions on the
# 1.52 series, which supports our Rust 1.75 promise (including async).
tokio = { version = "~1.52", optional = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }
# Observability facades (feature `observability`). MSRV-friendly: tracing 0.1
# (MSRV 1.65) and metrics 0.24 (MSRV 1.71.1) both build on Halcyon's 1.75.
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }
tracing-core = { version = "0.1", optional = true }
metrics = { version = "0.24", optional = true, default-features = false }

[dev-dependencies]
# UI/compile-fail tests for #[derive(FromRow)] (tests/derive_ui.rs); only run
# when the `derive` feature is enabled.
trybuild = "1"

# Micro-benchmarks (benches/pool_bench.rs); default-features off keeps plotters/
# rayon and their heavier deps out (and off the MSRV path), but `cargo_bench_support`
# stays on so `harness = false` benches still parse `cargo bench` args. The bench
# target is gated on `stress` via required-features, so a normal `cargo test`/MSRV
# build never compiles it.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# docs.rs has no clidriver and cannot link libdb2, so build the published docs
# without the `db2` feature. `derive` and `tokio` are pure-Rust (relative to
# clidriver) and part of the documented surface, so keep them on.
[package.metadata.docs.rs]
no-default-features = true
features = ["derive", "tokio", "observability"]

# loom is pulled in ONLY under `--cfg loom` (the dedicated CI job / manual runs).
# Normal builds, MSRV, and docs.rs never see it. It backs the cfg-gated `sync`
# shim so the pool's Mutex/Condvar/thread logic can be model-checked.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[[bench]]
name = "pool_bench"
harness = false
required-features = ["stress"]

[[example]]
name = "throughput"
required-features = ["stress"]

[[example]]
name = "batch_bench"
required-features = ["db2"]

[[example]]
name = "quick_start"
required-features = ["db2", "derive"]
