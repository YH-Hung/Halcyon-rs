name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Formatting, lint, and the pure-Rust test matrix. Everything above the seam
  # is mockable, so this needs no clidriver — the always-green backbone and the
  # guardian of the `cargo test --no-default-features` invariant.
  # ---------------------------------------------------------------------------
  lint-and-pure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (pure-Rust, no clidriver)
        run: |
          cargo clippy -p halcyon-derive --all-targets -- -D warnings
          cargo clippy -p halcyon --no-default-features --all-targets -- -D warnings
          cargo clippy -p halcyon --no-default-features --features derive --all-targets -- -D warnings
          cargo clippy -p halcyon --no-default-features --features tokio --all-targets -- -D warnings
          cargo clippy -p halcyon --no-default-features --features tokio,derive --all-targets -- -D warnings
          cargo clippy -p halcyon --no-default-features --features observability --all-targets -- -D warnings
          cargo clippy -p halcyon --no-default-features --features observability,derive --all-targets -- -D warnings
          cargo clippy -p halcyon --no-default-features --features observability,tokio,derive --all-targets -- -D warnings

      - name: Test (pure-Rust, no clidriver)
        run: |
          cargo test -p halcyon --no-default-features
          cargo test -p halcyon --no-default-features --features derive
          cargo test -p halcyon --no-default-features --features tokio
          cargo test -p halcyon --no-default-features --features tokio,derive
          cargo test -p halcyon --no-default-features --features observability
          cargo test -p halcyon --no-default-features --features observability,derive
          # Single-threaded: concurrent spawn_blocking set_default churns tracing's
          # callsite-interest cache and flakes execute_async_inherits_caller_context.
          cargo test -p halcyon --no-default-features --features observability,tokio,derive -- --test-threads=1
          cargo test -p halcyon-derive

  # ---------------------------------------------------------------------------
  # Compile-fail (trybuild) tests for #[derive(FromRow)]. Pinned toolchain: the
  # .stderr snapshots are rustc-version-specific, so this is the one job that
  # runs them (HALCYON_UI_TESTS=1). Bump the version here in lockstep with a
  # `TRYBUILD=overwrite` regeneration of the snapshots.
  # ---------------------------------------------------------------------------
  derive-ui:
    runs-on: ubuntu-24.04
    env:
      HALCYON_UI_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: UI tests
        # --no-default-features keeps `db2`/halcyon-sys (and the clidriver they
        # need) out of this driverless job; the derive is pure-Rust.
        run: cargo test -p halcyon --no-default-features --features derive --test derive_ui

  # ---------------------------------------------------------------------------
  # MSRV: the pure-Rust layers must build and test on the pinned minimum.
  # ---------------------------------------------------------------------------
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - uses: Swatinem/rust-cache@v2
      - name: Build + test on MSRV (pure-Rust)
        run: |
          cargo build -p halcyon --no-default-features --features derive
          cargo test -p halcyon --no-default-features --features derive

  # ---------------------------------------------------------------------------
  # Concurrency stress scenarios on stable (fast feedback). Pure-Rust: the fake
  # driver needs no clidriver. Also runs the stress module's own unit tests.
  # ---------------------------------------------------------------------------
  stress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Stress scenarios + unit tests
        run: |
          cargo test -p halcyon --no-default-features --features stress --lib
          cargo test -p halcyon --no-default-features --features stress --test stress

  # ---------------------------------------------------------------------------
  # The same scenarios under ThreadSanitizer on nightly — proves race/deadlock
  # freedom on interleavings the deterministic runs don't reach. Pure-Rust, so
  # no clidriver. -Zbuild-std rebuilds std with the sanitizer.
  # ---------------------------------------------------------------------------
  stress-tsan:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-Zsanitizer=thread"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Stress scenarios under TSan
        run: |
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p halcyon --no-default-features --features stress --test stress

  # ---------------------------------------------------------------------------
  # loom model-checking of the pool's Mutex/Condvar handoff. `--cfg loom` swaps
  # in loom's instrumented primitives (see src/sync.rs); the std unit tests are
  # excluded under loom, so only the loom models run.
  # ---------------------------------------------------------------------------
  loom:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "--cfg loom"
      LOOM_MAX_PREEMPTIONS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: loom models
        run: cargo test -p halcyon --no-default-features --lib loom_tests

  # ---------------------------------------------------------------------------
  # Full build + tests with the real Db2CliDriver linked against the clidriver.
  # No live DB here: the integration test skips without HALCYON_TEST_DSN.
  # ---------------------------------------------------------------------------
  db2-linux:
    runs-on: ubuntu-24.04
    env:
      DB2_CLIDRIVER_ROOT: third_party/clidriver
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Set up Db2 CLI driver
        uses: ./.github/actions/setup-db2-clidriver
      - name: Clippy (all features)
        run: cargo clippy --all-targets -- -D warnings
      # PR-gated: default features omit `tokio`, so compile the db2+tokio combo
      # here (connect/connect_with + live_tests). live-db2 only runs on main.
      - name: Clippy (db2 + tokio)
        run: cargo clippy --features tokio --all-targets -- -D warnings
      - name: Build
        run: cargo build
      - name: Test (unit + integration-skipped)
        run: cargo test

  # ---------------------------------------------------------------------------
  # The macOS cloud can't reliably reach IBM's driver host, so fetch the macOS
  # (x86_64) driver on Ubuntu and hand it to the Intel macOS job as an artifact
  # (mirrors the C++ repo).
  # ---------------------------------------------------------------------------
  prepare-macos-clidriver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch macOS Db2 CLI driver
        uses: ./.github/actions/setup-db2-clidriver
        with:
          platform: macos
      - name: Package
        run: tar -czf macos-clidriver.tar.gz -C third_party clidriver
      - uses: actions/upload-artifact@v4
        with:
          name: macos-clidriver
          path: macos-clidriver.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # macOS build + tests. Intel runner so the x86_64 IBM driver links and loads.
  # ---------------------------------------------------------------------------
  db2-macos:
    # macos-15-intel: last x86_64 macOS image (macos-13/14 are retired); the
    # IBM clidriver is x86_64-only, so the arm64 images cannot link it.
    runs-on: macos-15-intel
    needs: prepare-macos-clidriver
    env:
      DB2_CLIDRIVER_ROOT: third_party/clidriver
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: macos-clidriver
          path: /tmp/macos-clidriver
      - name: Unpack Db2 CLI driver
        run: |
          mkdir -p third_party
          tar -xzf /tmp/macos-clidriver/macos-clidriver.tar.gz -C third_party
          test -f third_party/clidriver/include/sqlcli1.h
          chmod -R u+w third_party/clidriver
          xattr -r -d com.apple.quarantine third_party/clidriver || true
      - name: Build
        run: cargo build
      - name: Test
        # IBM ships libdb2.dylib with a bare install name, so the rpath that
        # halcyon-sys embeds is never consulted (rpaths only apply to @rpath/
        # names) — dyld needs DYLD_LIBRARY_PATH to find the leaf name. It must
        # be set inside the step script: macOS SIP strips DYLD_* from the
        # environment of protected binaries like the /bin/bash running this
        # step, so a job-level `env:` would never reach cargo.
        run: DYLD_LIBRARY_PATH="$PWD/third_party/clidriver/lib" cargo test

  # ---------------------------------------------------------------------------
  # Live Db2 round-trip: stand up the Dockerized Db2 and run the integration
  # test against it. Skipped on PRs (the ~5-min image pull + boot would slow
  # every PR); runs on pushes to main and manual dispatch. On Linux runners the
  # published port is reachable at localhost with native container networking.
  # ---------------------------------------------------------------------------
  live-db2:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      DB2_CLIDRIVER_ROOT: third_party/clidriver
      HALCYON_TEST_DSN: DATABASE=SAMPLE;HOSTNAME=localhost;PORT=50000;PROTOCOL=TCPIP;UID=db2inst1;PWD=halcyon;
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set up Db2 CLI driver
        uses: ./.github/actions/setup-db2-clidriver
      - name: Start Db2 and wait for healthy
        run: docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 600
      - name: Live round-trip
        run: cargo test --test db2_roundtrip -- --nocapture
      - name: Live async round-trip
        run: cargo test -p halcyon --features tokio --lib live_async_round_trip -- --nocapture
      - name: Tear down Db2
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
